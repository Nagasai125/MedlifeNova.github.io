---
layout: default
---
{% assign events = site.data.events | where: 'status', page.status %}
<section class="py-16 md:py-24">
    <div class="container mx-auto px-6">
        <div class="text-center mb-12 md:mb-16 fade-in-element">
            <h1 class="text-4xl md:text-5xl font-bold text-teal-700 mb-4">{{ page.heading }}</h1>
            <p class="text-lg text-gray-600 max-w-2xl mx-auto">
                {{ content | strip }}
            </p>
        </div>

        <div class="space-y-12">

            {% for event in events %}
            {% include event-banner.html event=event level="2" %}
            {% else %}
            <p class="text-center">No {{ page.status }} events are listed.</p>
            {% endfor %}

        </div>
    </div>
</section>
