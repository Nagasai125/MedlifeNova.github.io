<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {% if page.home and site.data.members.size > 0 %}<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;600;700&amp;display=swap">{% endif %}
  {% if page.home %}<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">{% endif %}
  {% if page.gallery %}<link rel="stylesheet" href="{{ '/assets/css/gallery.css' | relative_url }}">{% endif %}
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
  {% if page.home %}<script defer src="{{ '/assets/js/home.js' | relative_url }}"></script>{% endif %}
  {% if page.gallery %}<script defer src="{{ '/assets/js/gallery.js' | relative_url }}"></script>{% endif %}
</head>
<body class="bg-gray-100 text-gray-800">
  {% if page.home %}<div class="scroll-progress" id="scrollProgress"></div>{% endif %}
  {% include header.html %}
  <main>{{ content }}</main>
  {% include footer.html %}
</body>
</html>
